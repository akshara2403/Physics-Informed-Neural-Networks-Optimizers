[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-bench"
version = "0.1.0"
description = "Empirical solution-gap and stability analysis of matrix-preconditioned optimizers for PINNs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "sympy"]

[tool.setuptools.packages.find]
where = ["src"]
