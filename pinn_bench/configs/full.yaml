# Extended run config, actually executed to produce the results reported in
# RESULTS.md / the manuscript draft. Scope is set for CPU-only execution on a
# 2-core sandbox (measured, not guessed -- see docs/RUN_LOG.md) rather than
# the GPU scale ("5 seeds x 5000 steps") the original roadmap assumed; the
# seed count (5) matches the roadmap's non-quick setting, but step counts and
# collocation-point counts are reduced so the full 4-problem x 6-optimizer x
# 5-seed = 120-run sweep completes in well under an hour on 2 CPU cores. This
# tradeoff (fewer optimizer steps per run, more seeds and more problems, incl.
# the new KdV benchmark) is the honestly-stated scope of this run -- see
# RESULTS.md for the exact measured wall-clock time.
seeds: [0, 1, 2, 3, 4]
problems: ["heat", "burgers", "allen_cahn", "kdv"]
optimizers: ["Adam", "LBFGS", "Adam_LBFGS", "Shampoo", "SOAP", "Muon"]
adam_steps: 2000
shampoo_steps: 2000
hybrid_adam_steps: 1200
lbfgs_max_iter: 400
n_f: 2000
n_ic: 200
n_bc: 200
results_dir: "results/full"
hparams:
  Muon:
    lr: 0.01
